# ============================================================
# Code Review Service - 配置文件模板
# ============================================================
# 复制此文件为 config.yaml 或 config.production.yaml，修改后使用。
# 敏感信息建议通过环境变量覆盖（使用 CODE_REVIEW__ 前缀）。

server:
  host: "0.0.0.0"
  port: 8000
  debug: false
  secret_key: "change-me-in-production"
  log_level: "INFO"  # DEBUG / INFO / WARNING / ERROR

database:
  url: "postgresql+asyncpg://postgres:postgres@localhost:5432/code_review"
  echo: false
  pool_size: 10

redis:
  url: "redis://localhost:6379/0"

celery:
  broker_url: "redis://localhost:6379/1"
  result_backend: "redis://localhost:6379/2"
  task_serializer: "json"
  result_serializer: "json"
  timezone: "Asia/Shanghai"

# ---- GitHub 配置 ----
github:
  token: ""  # GitHub Personal Access Token
  api_url: "https://api.github.com"
  webhook_secret: ""  # Webhook 签名密钥

# ---- GitLab 配置 ----
gitlab:
  token: ""  # GitLab Private Token
  api_url: "https://gitlab.com/api/v4"  # 自托管改为实际地址
  webhook_secret: ""

# ---- Gitee 配置 ----
gitee:
  token: ""  # Gitee Personal Access Token（通过 .env 中 CODE_REVIEW__GITEE__TOKEN 覆盖）
  api_url: "https://gitee.com/api/v5"
  webhook_secret: ""  # Webhook 密钥（通过 .env 中 CODE_REVIEW__GITEE__WEBHOOK_SECRET 覆盖）
  # Gitee 平台侧配置的 Webhook 地址：https://lycodeing.cn/webhook/gitee

# ---- LLM 配置 ----
llm:
  model: "gpt-4"  # 支持: gpt-4, gpt-4o, claude-3-opus, deepseek/deepseek-chat 等
  api_key: ""
  api_base: ""  # 自定义 API 地址（如本地部署）
  temperature: 0.3
  max_tokens: 4096
  timeout: 120

# ---- 评审行为配置 ----
review:
  comment_language: "zh"  # zh (中文) / en (英文)
  comment_mode: "detailed"  # detailed (详细行内评论) / summary (仅摘要)
  max_comments_per_mr: 50
  max_diff_lines: 5000
  severity_threshold_for_summary: 30
  exclude_patterns:
    - "*.lock"
    - "*.min.js"
    - "*.min.css"
    - "vendor/**"
    - "node_modules/**"
    - "*.generated.*"
    - "dist/**"
    - "*.pb.go"
    - "package-lock.json"
    - "yarn.lock"

# ---- 飞书通知 ----
feishu:
  enabled: false
  webhook_url: ""
  secret: ""  # 可选签名密钥

# ---- 钉钉通知 ----
dingtalk:
  enabled: false
  webhook_url: ""
  secret: ""  # 可选签名密钥

# ---- 邮件通知（预留）----
email:
  enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  from_addr: ""
  to_addrs: []
