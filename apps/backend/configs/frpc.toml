# frpc 配置 — 本机连接公网 frps

serverAddr = "lycodeing.cn"
serverPort = 7000

# 认证 token（必须与服务器 frps.toml 中的一致）
# 部署后替换为实际 token
auth.token = "lycodeing9527"

# HTTP 隧道：后端 API (8000 → api.lycodeing.cn)
[[proxies]]
name = "code-review-api"
type = "http"
localIP = "127.0.0.1"
localPort = 8000
customDomains = ["api.lycodeing.cn"]

# HTTP 隧道：前端页面 (3000 → app.lycodeing.cn)
[[proxies]]
name = "code-review-app"
type = "http"
localIP = "127.0.0.1"
localPort = 3000
customDomains = ["app.lycodeing.cn"]
