x-backend: &backend
  build:
    context: ../apps/backend
    dockerfile: Dockerfile
  env_file:
    - path: ../apps/backend/configs/.env
      required: false
  environment:
    - TZ=Asia/Shanghai
    - CODE_REVIEW__DATABASE__URL=postgresql+asyncpg://postgres:postgres@db:5432/code_review
    - CODE_REVIEW__REDIS__URL=redis://redis:6379/0
    - CODE_REVIEW__CELERY__BROKER_URL=redis://redis:6379/1
    - CODE_REVIEW__CELERY__RESULT_BACKEND=redis://redis:6379/2
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    container_name: code-review-frontend
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

  app:
    <<: *backend
    container_name: code-review-app
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    container_name: code-review-worker
    command:
      - celery
      - -A
      - code_review.worker
      - worker
      - -Q
      - review
      - -l
      - info
      - --concurrency=5

  db:
    image: postgres:16-alpine
    container_name: code-review-db
    environment:
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
      POSTGRES_DB: code_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../apps/backend/migrations/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: code-review-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
